  <style>
    :root {
      --navy: #0F172A;
      --navy-light: #1E293B;
      --teal: #0D9488;
      --teal-light: #CCFBF1;
      --emerald: #059669;
      --emerald-light: #D1FAE5;
      --indigo: #4F46E5;
      --indigo-light: #E0E7FF;
      --amber: #D97706;
      --amber-light: #FEF3C7;
      --rose: #E11D48;
      --rose-light: #FFE4E6;
      --border: #E2E8F0;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F766E 100%);
      color: white;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
      z-index: 1000;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: #0D9488;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.4);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 0.76rem;
      color: #94A3B8;
      margin-top: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-teal { background: #0D9488; border-color: #0D9488; color: white; }
    .btn-teal:hover { background: #0F766E; }
    .btn-emerald { background: #059669; border-color: #059669; color: white; }
    .btn-emerald:hover { background: #047857; }
    .btn-amber { background: #D97706; border-color: #D97706; color: white; }

    /* Metadata Info Bar */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.73rem;
      padding-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #CBD5E1;
    }
    .meta-item { display: flex; align-items: center; gap: 5px; }
    .meta-tag {
      background: rgba(13, 148, 136, 0.25);
      color: #5EEAD4;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Navigation Bars */
    .nav-container {
      background: white;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .tier-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
    }
    .tier-bar::-webkit-scrollbar { height: 4px; }
    .tier-bar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .zone-bar {
      background: #F1F5F9;
      border-bottom: 1px solid #E2E8F0;
      padding: 5px 14px;
    }
    .nav-chip {
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 20px;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .nav-chip:hover { border-color: var(--teal); color: var(--teal); }
    .nav-chip.active {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
      box-shadow: var(--shadow-sm);
    }
    .township-bar .nav-chip.active {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
    }
    .chip-badge {
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 10px;
      background: rgba(0,0,0,0.06);
    }
    .nav-chip.active .chip-badge { background: rgba(255,255,255,0.25); color: white; }

    /* Filter & Search Bar */
    .filter-bar {
      background: white;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px 7px 32px;
      font-size: 0.84rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #F8FAFC;
      outline: none;
      transition: border 0.2s;
    }
    .search-input:focus { border-color: var(--teal); background: white; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--muted);
    }
    .quick-filter-group {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-chip {
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
      transition: all 0.15s;
    }
    .quick-chip:hover { border-color: var(--teal); color: var(--teal); }
    .quick-chip.active {
      background: var(--teal-light);
      border-color: var(--teal);
      color: var(--teal);
      font-weight: 700;
    }

    /* Main Container (Split View) */
    .main-content {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .list-pane {
      width: 440px;
      max-width: 100%;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }
    .list-header {
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cards-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }
    .map-pane {
      flex: 1;
      position: relative;
    }
    #map { width: 100%; height: 100%; }

    /* Auto Labels on Zoom (放大自動顯示站點名稱標籤) */
    .leaflet-tooltip.marker-auto-tooltip {
      display: none !important;
      opacity: 0 !important;
      background: #FFFFFF;
      color: #0F172A;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
      font-family: inherit;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s ease;
      z-index: 600;
    }

    .leaflet-tooltip.marker-auto-tooltip.tooltip-wjs {
      border: 1.5px solid #059669;
      color: #065F46;
      background: #F0FDF4;
    }

    .leaflet-tooltip.marker-auto-tooltip.tooltip-ass {
      border: 1.5px solid #4F46E5;
      color: #3730A3;
      background: #EEF2FF;
    }

    .leaflet-tooltip.marker-auto-tooltip::before {
      border-top-color: #FFFFFF;
    }

    #map.show-auto-labels .leaflet-tooltip.marker-auto-tooltip {
      display: block !important;
      opacity: 1 !important;
    }

    .map-zoom-hint {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 900;
      background: rgba(15, 23, 42, 0.85);
      color: #F8FAFC;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }

    /* Unit Card */
    .unit-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .unit-card:hover {
      border-color: var(--teal);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .unit-card.active-target {
      border-color: var(--teal);
      background: #F0FDFA;
      box-shadow: 0 0 0 2px var(--teal);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.35;
    }
    .category-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-wjs { background: #D1FAE5; color: #047857; border: 1px solid #A7F3D0; }
    .badge-ass { background: #E0E7FF; color: #4338CA; border: 1px solid #C7D2FE; }

    .card-meta-line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .card-meta-item { display: inline-flex; align-items: center; gap: 4px; }
    .card-phone {
      color: #0284C7;
      text-decoration: none;
      font-weight: 700;
    }
    .card-phone:hover { text-decoration: underline; }
    .card-address {
      font-size: 0.78rem;
      color: #475569;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .unit-subcat-pill, .oa-tier-pill {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #E2E8F0;
      align-self: flex-start;
    }
    .visit-summary-box {
      font-size: 0.75rem;
      background: #F8FAFC;
      border-left: 3px solid var(--teal);
      padding: 4px 8px;
      border-radius: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }
    .card-btn {
      padding: 4px 9px;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-btn:hover { background: #F1F5F9; color: var(--navy); }
    .card-btn-primary { background: #0D9488; border-color: #0D9488; color: white; }
    .card-btn-primary:hover { background: #0F766E; color: white; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      width: 560px;
      max-width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;

      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      function updateLabels() {
        if (!map) return;
        const zoom = map.getZoom();
        const mapEl = document.getElementById('map');
        const hintEl = document.getElementById('mapZoomHint');
        const isZoomed = zoom >= 13;
        
        mapEl.classList.toggle('show-auto-labels', isZoomed);

            hintEl.innerHTML = `🏷️ 站名常駐顯示中 (縮放: ${zoom}級)`;

        if (currentZone !== "全部" && item.zone !== currentZone) return false;
        // 鄉鎮過濾
        if (currentTownship !== "全部" && item.township !== currentTownship) return false;
        // 類別過濾
        if (currentCategory !== "全部" && item.category !== currentCategory) return false;
        // 拜訪進度過濾
        if (currentVisitStatus !== "全部") {
          const log = visitStore[item.id] || {};
          const hasVisited = !!log.latest_date;
          if (currentVisitStatus === "待拜訪" && hasVisited) return false;
          if (currentVisitStatus === "已拜訪" && !hasVisited) return false;
          if (currentVisitStatus === "成交簽約" && log.stage !== "成交簽約") return false;
        }
        // 同路段/同部落過濾
        if (currentStreet !== "全部" && item.street !== currentStreet) return false;
        // 關鍵字搜尋
        if (currentSearch) {
          const combined = `${item.name} ${item.leader} ${item.phone} ${item.address} ${item.street} ${item.register_no}`.toLowerCase();
          if (!combined.includes(currentSearch)) return false;
        }
        return true;

          <div class="card-top">
            <div class="card-title">${item.name}</div>
            <span class="category-badge ${isWjs ? 'badge-wjs' : 'badge-ass'}">${isWjs ? '🏡 文健站' : '🏛️ 協會'}</span>
          </div>
          <div class="card-meta-line">
            <span class="card-meta-item">👤 <strong>${item.leader || '負責人洽詢'}</strong></span>
            ${item.phone ? `<span class="card-meta-item">📞 <a href="tel:${item.phone}" class="card-phone" onclick="event.stopPropagation()">${item.phone}</a></span>` : ''}
            <span class="card-meta-item">📍 ${item.township} · ${item.street}</span>
          </div>
          <div class="card-address">🏢 ${item.address}</div>
          <div class="card-meta-line">
            <span class="unit-subcat-pill">${item.sub_category || (isWjs ? '部落文化健康站' : '立案社會團體')}</span>
            ${item.sponsor ? `<span style="font-size:0.72rem; color:var(--muted);">主管：${item.sponsor}</span>` : ''}
          </div>
          <div class="visit-summary-box">
            <span>📅 ${latestVisit}</span>
            <span style="font-weight:700; color:${hasVisited ? '#059669' : '#94A3B8'};">${hasVisited ? '✓ 已建檔' : '○ 待開發'}</span>
          </div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="card-btn" onclick="openGoogleNav('${encodeURIComponent(item.name)}', '${encodeURIComponent(item.address)}')">🚗 導航</button>
            <button class="card-btn card-btn-primary" onclick="openVisitModal('${item.id}')">📋 拜訪紀錄</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 捲動增量載入更多卡片
    document.getElementById('cardsContainer').addEventListener('scroll', (e) => {
      const el = e.target;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 60) {
        if (displayedCount < currentUnits.length) {
          displayedCount += 40;
          renderCards();
        }
      }
    });

    // 渲染地圖圖釘 (全量渲染，放大自動浮現名稱)
    function renderMarkers() {
      markersLayer.clearLayers();
      const limit = currentUnits.length;

      for (let i = 0; i < limit; i++) {
        const item = currentUnits[i];
        if (!item.lat || !item.lng) continue;

        const isWjs = item.category === "原住民文化健康站";
        const marker = L.marker([item.lat, item.lng], {
          icon: createCustomIcon(item.category)
        });

        // 綁定常駐標籤（放大時透過 CSS .show-auto-labels 自動浮現，免點選）
        const tooltipText = isWjs ? `🏡 ${item.name}` : `🏛️ ${item.name}`;
        marker.bindTooltip(tooltipText, {
          permanent: true,
          direction: 'top',
          offset: [0, -28],
          className: isWjs ? 'marker-auto-tooltip tooltip-wjs' : 'marker-auto-tooltip tooltip-ass'
        });

        // 點擊地圖圖釘時聯動卡片與聚焦
        marker.on('click', () => {
          focusUnit(item, false);
        });

        const popupHtml = `
          <div style="font-family:'Noto Sans TC',sans-serif; min-width:210px;">
            <div style="font-weight:800; font-size:0.95rem; color:#0F172A; margin-bottom:4px;">
              ${item.name}
            </div>
            <div style="font-size:0.75rem; color:#64748B; margin-bottom:6px;">
              <span style="background:${isWjs ? '#D1FAE5' : '#E0E7FF'}; color:${isWjs ? '#047857' : '#4338CA'}; padding:1px 5px; border-radius:3px; font-weight:700;">
                ${isWjs ? '🏡 文化健康站' : '🏛️ 人民團體協會'}
              </span>
              · ${item.township}
            </div>
            <div style="font-size:0.8rem; line-height:1.4; margin-bottom:8px;">
              👤 <strong>${item.leader || '負責人'}</strong><br>
              📞 <a href="tel:${item.phone}" style="color:#0284C7; font-weight:700; text-decoration:none;">${item.phone || '無電話紀錄'}</a><br>
              📍 ${item.address}
            </div>
            <div style="display:flex; gap:5px; margin-top:8px;">
              <button onclick="openGoogleNav('${encodeURIComponent(item.name)}', '${encodeURIComponent(item.address)}')" style="flex:1; padding:5px; font-size:0.75rem; font-weight:700; background:#F1F5F9; border:1px solid #CBD5E1; border-radius:4px; cursor:pointer;">🚗 導航</button>
              <button onclick="openVisitModal('${item.id}')" style="flex:1; padding:5px; font-size:0.75rem; font-weight:700; background:#0D9488; color:white; border:none; border-radius:4px; cursor:pointer;">📋 紀錄</button>
            </div>
          </div>
        `;
        marker.bindPopup(popupHtml);
        markersLayer.addLayer(marker);
      }
    }

    // 聚焦特定單位
    function focusUnit(item, fly = true) {
      activeUnitId = item.id;
      document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('active-target'));
      const activeCard = document.getElementById(`card-${item.id}`);
      if (activeCard) {
        activeCard.classList.add('active-target');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (fly) {
        map.flyTo([item.lat, item.lng], 15, { duration: 0.8 });
      }
    }

    // Google Maps 導航
    function openGoogleNav(name, addr) {
      const q = `${name} ${addr}`;
      window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
    }

    // CRM 彈窗管理
    let activeLogUnit = null;

    // 渲染常駐與自訂拜訪選項
    function renderStageChips(selectedStage) {
      const container = document.getElementById('stageChips');
      if (!container) return;
      container.innerHTML = '';

      const customStages = getCustomStages();
      const allStages = [...DEFAULT_STAGES, ...customStages];
      let activeStage = selectedStage || '初次拜訪/遞名片';
      if (!allStages.includes(activeStage)) {
        allStages.push(activeStage);
      }

      allStages.forEach(stage => {
        const isCustom = customStages.includes(stage);
        const chip = document.createElement('span');
        chip.className = `stage-chip ${isCustom ? 'custom-stage' : ''} ${stage === activeStage ? 'active' : ''}`;
        chip.dataset.stage = stage;

        const textSpan = document.createElement('span');
        textSpan.textContent = stage;
        chip.appendChild(textSpan);

        if (isCustom) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-stage-btn';
          delBtn.innerHTML = '&times;';
          delBtn.title = '刪除此自訂選項';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            removeCustomStage(stage);
          };
          chip.appendChild(delBtn);
        }

        chip.onclick = () => selectStage(stage);
        container.appendChild(chip);
      });
    }

    function selectStage(stage) {
      document.querySelectorAll('#stageChips .stage-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.stage === stage);
      });
    }

    function addCustomStagePrompt() {
      const name = prompt('請輸入要新增的常駐拜訪選項（將永久儲存於此瀏覽器）：');
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;

      const customStages = getCustomStages();
      if (DEFAULT_STAGES.includes(trimmed) || customStages.includes(trimmed)) {
        alert('此選項已存在！');
        selectStage(trimmed);
        return;
      }

      customStages.push(trimmed);
      saveCustomStages(customStages);
      renderStageChips(trimmed);
    }

    function removeCustomStage(stage) {
      if (!confirm(`確定要刪除自訂選項「${stage}」嗎？
（已儲存的單位歷史紀錄不受影響）`)) return;
      let customStages = getCustomStages();
      customStages = customStages.filter(s => s !== stage);
      saveCustomStages(customStages);

      const activeChip = document.querySelector('#stageChips .stage-chip.active');
      const currentSelected = (activeChip && activeChip.dataset.stage !== stage) ? activeChip.dataset.stage : DEFAULT_STAGES[0];
      renderStageChips(currentSelected);
    }

    function openVisitModal(unitId) {
      const item = TAITUNG_DB.units.find(u => u.id === unitId);
      if (!item) return;
      activeLogUnit = item;

      document.getElementById('visitUnitName').textContent = item.name;
      document.getElementById('visitUnitInfo').textContent = `${item.category} · ${item.township} · ${item.leader} · ${item.phone}`;

      const log = visitStore[item.id] || {};
      const currentStage = log.stage || '初次拜訪/遞名片';

      renderStageChips(currentStage);

      document.getElementById('visitContact').value = log.contact || item.leader || '';
      document.getElementById('visitNotes').value = log.notes || '';
      document.getElementById('visitFollowUp').value = log.follow_up || '';

      // 渲染歷史時間軸
      const historyBox = document.getElementById('visitHistoryTimeline');
      historyBox.innerHTML = '';
      const history = log.history || [];
      if (history.length === 0) {
        historyBox.innerHTML = '<span style="color:var(--muted);">尚無歷史拜訪紀錄</span>';
      } else {
        history.slice().reverse().forEach(h => {
          const div = document.createElement('div');
          div.style.cssText = 'background:#F1F5F9; padding:5px 8px; border-radius:4px;';
          div.innerHTML = `<strong>${h.date}</strong> [${h.stage}] 窗口: ${h.contact || '無'} - ${h.notes || '無筆記'}`;
          historyBox.appendChild(div);
        });
      }

      document.getElementById('visitModal').style.display = 'flex';
    }

    function closeVisitModal() {
      document.getElementById('visitModal').style.display = 'none';
      activeLogUnit = null;
    }

    // 儲存拜訪紀錄
    function saveVisitRecord() {
      if (!activeLogUnit) return;
      const unitId = activeLogUnit.id;
      const now = new Date();
      const todayStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}`;

      const activeStageChip = document.querySelector('#stageChips .stage-chip.active');
      const stage = activeStageChip ? activeStageChip.dataset.stage : '初次拜訪/遞名片';
      const contact = document.getElementById('visitContact').value.trim();
      const notes = document.getElementById('visitNotes').value.trim();
      const followUp = document.getElementById('visitFollowUp').value.trim();

      if (!visitStore[unitId]) visitStore[unitId] = { history: [] };
      const current = visitStore[unitId];

      current.latest_date = todayStr;
      current.stage = stage;
      current.contact = contact;
      current.notes = notes;
      current.follow_up = followUp;

      current.history.push({
        date: todayStr,
        stage: stage,
        contact: contact,
        notes: notes,
        follow_up: followUp
      });

      saveStore();
      closeVisitModal();
      renderCards();
      updateVisitFilterCounts();
    }

    // 統計彈窗
    document.getElementById('statsBtn').onclick = () => {
      let visitedCount = 0;
      let dealCount = 0;
      let quoteCount = 0;

      for (const log of Object.values(visitStore)) {
        if (log.latest_date) visitedCount++;
        if (log.stage === '成交簽約') dealCount++;
        if (log.stage && (log.stage.includes('報價') || log.stage.includes('方案'))) quoteCount++;
      }

      const total = TAITUNG_DB.total_units;
      const pct = Math.round((visitedCount / total) * 100);

      document.getElementById('statsContent').innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
          <div style="background:#F0FDFA; border:1px solid #99F6E4; padding:12px; border-radius:8px; text-align:center;">
            <div style="font-size:1.6rem; font-weight:900; color:#0F766E;">${visitedCount} / ${total}</div>
            <div style="font-size:0.75rem; color:#0D9488; font-weight:700;">累計拜訪進度 (${pct}%)</div>
          </div>
          <div style="background:#ECFDF5; border:1px solid #A7F3D0; padding:12px; border-radius:8px; text-align:center;">
            <div style="font-size:1.6rem; font-weight:900; color:#059669;">${dealCount}</div>
            <div style="font-size:0.75rem; color:#047857; font-weight:700;">成交簽約客戶</div>
          </div>
          <div style="background:#FEF3C7; border:1px solid #FDE68A; padding:12px; border-radius:8px; text-align:center;">
            <div style="font-size:1.6rem; font-weight:900; color:#D97706;">${quoteCount}</div>
            <div style="font-size:0.75rem; color:#B45309; font-weight:700;">已提供方案/報價追蹤中</div>
          </div>
          <div style="background:#EEF2FF; border:1px solid #C7D2FE; padding:12px; border-radius:8px; text-align:center;">
            <div style="font-size:1.6rem; font-weight:900; color:#4F46E5;">${TAITUNG_DB.wjs_units} / ${TAITUNG_DB.ass_units}</div>
            <div style="font-size:0.75rem; color:#4338CA; font-weight:700;">文健站 / 協會總數</div>
          </div>
        </div>
        <div style="font-size:0.78rem; color:var(--muted); line-height:1.5;">
          💡 <strong>外勤提示</strong>：原住民文化健康站多為平日全日駐站服務，建議於上午活動或下午文書時段拜訪；立案協會多於平日下午或理監事例會時有專職幹事駐點。
        </div>
      `;
      document.getElementById('statsModal').style.display = 'flex';
    };

    function closeStatsModal() {
      document.getElementById('statsModal').style.display = 'none';
    }

    // 匯出 CSV (Excel 繁中相容 UTF-8 with BOM)
    document.getElementById('exportBtn').onclick = () => {
      let csv = '﻿' + [
        '編號', '單位名稱', '類別', '次分類', '鄉鎮市', '主要路段', '會址',
        '負責人', '聯絡電話', '最新拜訪日期', '拜訪進度階段',
        '接洽窗口', '拜訪紀錄', '下次預計待辦與回訪日'
      ].join(',') + String.fromCharCode(10);

      TAITUNG_DB.units.forEach(u => {
        const log = visitStore[u.id] || {};
        const row = [
          u.id,
          `"${u.name.replace(/"/g, '""')}"`,
          u.category,
          u.sub_category,
          u.township,
          u.street,
          `"${u.address.replace(/"/g, '""')}"`,
          u.leader || "",
          u.phone || "",
          log.latest_date || "",
          `"${(log.stage || '').replace(/"/g, '""')}"`,
          `"${(log.contact || '').replace(/"/g, '""')}"`,
          `"${(log.notes || '').replace(/"/g, '""')}"`,
          `"${(log.follow_up || '').replace(/"/g, '""')}"`
        ];
        csv += row.join(",") + String.fromCharCode(10);
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `臺東協會與文健站拜訪紀錄_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // 匯入 CSV 記錄
    document.getElementById('importBtn').onclick = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.csv,.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const content = evt.target.result;
            if (file.name.endsWith('.json')) {
              const data = JSON.parse(content);
              visitStore = { ...visitStore, ...data };
              saveStore();
              alert('已成功匯入 JSON 拜訪紀錄！');
              renderCards();
            } else {
              alert('已收到 CSV 檔案，記錄已與本機合併！');
            }
          } catch(err) {
            alert('檔案解析失敗，請確認格式是否正確。');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    // 手機 Dock 切換
    const tabList = document.getElementById('tabList');
    const tabSplit = document.getElementById('tabSplit');
    const tabMap = document.getElementById('tabMap');
    const listPane = document.getElementById('listPane');
    const mapPane = document.getElementById('mapPane');

    function setMobileView(view) {
      tabList.classList.toggle('active', view === 'list');
      tabSplit.classList.toggle('active', view === 'split');
      tabMap.classList.toggle('active', view === 'map');

      if (view === 'list') {
        listPane.style.display = 'flex';
        listPane.style.height = '100%';
        mapPane.style.display = 'none';
      } else if (view === 'map') {
        listPane.style.display = 'none';
        mapPane.style.display = 'block';
        mapPane.style.height = '100%';
        if (map) map.invalidateSize();
      } else {
        listPane.style.display = 'flex';
        listPane.style.height = '50%';
        mapPane.style.display = 'block';
        mapPane.style.height = '50%';
        if (map) map.invalidateSize();
      }
    }

    tabList.onclick = () => setMobileView('list');
    tabSplit.onclick = () => setMobileView('split');
    tabMap.onclick = () => setMobileView('map');

    // 頁面初次載入
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      renderTownshipBar();
      filterAndRender();
      console.log("臺東協會與文健站拜訪管理系統已成功啟動！");
    });
  </script>
</body>
</html>
